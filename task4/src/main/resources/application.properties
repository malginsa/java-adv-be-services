spring.application.name=security-demo

# Neon (serverless Postgres). Provided via environment variables, e.g. in PowerShell:
#   $env:DB_URL="jdbc:postgresql://ep-odd-fire-aymw4i53-pooler.c-5.us-east-2.aws.neon.tech/neondb?sslmode=require"
#   $env:DB_USER="neondb_owner"; $env:DB_PASSWORD="<password>"
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-odd-fire-aymw4i53-pooler.c-5.us-east-2.aws.neon.tech/neondb?sslmode=require}
spring.datasource.username=${DB_USER:neondb_owner}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Brute force protection
app.security.max-failed-attempts=3
app.security.block-duration-minutes=5
