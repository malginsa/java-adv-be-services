spring:
  application:
    name: be-services-task1
  datasource:
    url: "jdbc:h2:mem:mydb"
    username: "test"
    pool-size: 30
management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
